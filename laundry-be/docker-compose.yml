version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: laundry-postgres
    restart: unless-stopped
    environment:
      # Default = nilai dev; di produksi override lewat env (laundry-be/.env) dan
      # pastikan DATABASE_URL ikut diselaraskan. Jangan pakai password default di prod.
      POSTGRES_USER: ${POSTGRES_USER:-laundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laundry_password}
      POSTGRES_DB: ${POSTGRES_DB:-laundry_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laundry-network

  redis:
    image: redis:7-alpine
    container_name: laundry-redis
    restart: unless-stopped
    # Insiden 2026-11-21: Redis tanpa auth terbuka ke internet disalahgunakan
    # (SLAVEOF/CONFIG). Sekarang: password dari REDIS_PASSWORD (.env; kosong =
    # tanpa auth untuk dev), perintah berbahaya dimatikan PERMANEN (bertahan
    # walau container dibuat ulang), dan port hanya di loopback host.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
        --rename-command CONFIG ""
        --rename-command DEBUG ""
        --rename-command MODULE ""
        --rename-command SLAVEOF ""
        --rename-command REPLICAOF ""
        --rename-command SYNC ""
        --rename-command PSYNC ""
        --rename-command MIGRATE ""
        --rename-command FLUSHALL ""
        --rename-command FLUSHDB ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laundry-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: laundry-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - laundry-network

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:

networks:
  laundry-network:
    driver: bridge
